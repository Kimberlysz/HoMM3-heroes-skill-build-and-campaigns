  (3) Heroes of Might and Magic III (HoMM3)
    a. character
      i. Clancy the Ranger
      ii. Gem the Sorceress
      iii. Terek the battle mage

    b. scenario tips:
      (a) Gem (main hero): Gem will carry the main army and all valuable artifacts. She will be the one fighting all major battles and conquering enemy towns.
      (b) Clancy (Support Hero): 
        i. 'Clancy' high 'Logistics' and 'Pathfinding' make him an excellent scout and resource gatherer.
        ii. 'Clancy' can quickly clear the map of neutral resources and mines, leaving Gem free to focus on fighting stronger creatures.
      (3) Terek the battle mage
        i. Terek, focusing on Air and Logistics, can act as a more mobile, army-supporting hero.
  
