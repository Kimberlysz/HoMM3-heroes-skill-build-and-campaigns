  (3) Heroes of Might and Magic III (HoMM3)
    a. character
      i. Finneas Vilmar the Necromancer
      ii. Sandro the Necromancer

    b. scenario tips:
      (b) Sandro the Necromancer
        i. Scenario 1 is the reroll point: restart until Sandro has few Wights, few Walking Dead and pack of Skeletons. Also equip and combine everything in his backpack on day 1 — assemble Armor of the Damned and Cloak of the Undead King on Sandro.
        ii. Starting bonus in scenario 1: take the Lightning Bolt scroll. Although you might be tempted to take the +2 Attack Skill as your bonus, taking the Lightning Bolt scroll will make the first three weeks much easier.
        iii. The Armor of the Damned auto-casts Mass Slow, Mass Curse, Mass Weakness and Mass Misfortune when you get initiative — which is why Air Magic (Haste/speed) and high Spell Power matter more than raw Attack on him.
        iv. Feed him every weak wandering stack you can: attacking weak wandering stacks to build up Sandro's supply of Liches is the whole strategy once Necromancy hits Expert.
        v. Push Necropolis creature dwellings over gold buildings early — focus on creature generator buildings instead of gold producing buildings for the first week or two.
      
      (a) Finneas Vilmar the Necromancer
        i. Sandro is the blitz hero, Finneas is the second front
        ii. Don't let him idle. The standard approach is to have Sandro blitzkrieg and when the main enemies are more or less defeated, give the major artifacts to Finneas so he can fight neutral stacks and level up. He's capped at 20 in scenario 3 and carries forward, so wasted turns are permanently lost stats.
        iii. Early on he's fragile: Finneas can help out but you must be careful to keep him alive or you'll lose the scenario. Give him a Skeleton wall before sending him anywhere alone.
        iv. His specialty only pays off with high Spell Power, so prioritize Power-boosting stat objects for him and let Sandro take the Knowledge ones.
        v. Practical split: Sandro takes the main push, Finneas takes the secondary direction — send him south from A1 to engage in some sea battles as well as heading down E1a to flag the mines down there.

