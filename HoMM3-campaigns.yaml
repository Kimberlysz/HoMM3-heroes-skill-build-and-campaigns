  (3) Heroes of Might and Magic III (HoMM3)
    a. character
      i. Gelu the ranger

    b. scenario tips:
      (a) Scenario 1 (Graduation Exercise) is the reroll point. The community advice is to restart it until Gelu's early offers are good — Wisdom and Earth Magic are the must-haves. The StrategyWiki walkthrough says the same: if we are offered Wisdom, Logistics or Earth Magic for Gelu, take it.
      (b) Take Sharpshooters (20) as the scenario 1 starting bonus.
      (c) Secondary heroes carry over from scenario 1 up to 3 included; only scenario 4 has no carryover — so level a couple of support heroes in maps 1–3 by flagging mines and hauling Elves, then in map 4 let Gelu do everything himself.
      (d) Keep the Ring of Vitality and Ring of Life on him. Don't sacrifice them at the altar of sacrifices — they're two of the three Elixir components.
      (e) If you're rushing on high difficulty, scenario 1 has a known bug: Dimension Door and Fly are not banned there (they are banned in scenarios 2–4), so an Intelligence-based magic support hero with Air and Earth can break the map open.

