  (3) Heroes of Might and Magic III (HoMM3)
    a. character
      i. Yog the Barbarian

    b. scenario tips:
      (a) Without spells 'Yog the Barbarian' can't Slow or Haste, so speed and tempo come from creatures and Tactics — favor fast units and let Armorer absorb the first exchanges.
      (b) Because 'Yog the Barbarian' can't cast, his eight slots are really only for might skills, and there aren't quite eight good ones. That's why Ballistics/Artillery and Resistance, normally junk, are fine choices for him — anything beats an empty-value slot.

